[package]
name = "recovery-core"
version = "0.1.0"
edition = "2021"
description = "Read-only WhatsApp/Android data recovery engine: ADB acquisition, backup scanning, crypt12/14/15 decryption, SQLite parsing and deleted-record carving"

[lib]
name = "recovery_core"
path = "src/lib.rs"

[[bin]]
name = "recovery-core"
path = "src/main.rs"

[[bin]]
name = "remote_agent_server"
path = "src/bin/remote_agent_server.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
aes-gcm = "0.10"
generic-array = "0.14"
hex = "0.4"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
tar = "0.4"

[profile.release]
lto = true
